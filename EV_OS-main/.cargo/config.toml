[env]
# Cyclone DDS 0.10.5 install prefix (built by tools/bootstrap.sh). Override with
# CYCLONEDDS_HOME in the environment for a system install.
CYCLONEDDS_HOME = { value = ".deps/cyclonedds", relative = true, force = false }
LD_LIBRARY_PATH = { value = ".deps/cyclonedds/lib", relative = true, force = false }

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.thumbv7em-none-eabihf]
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "target-cpu=cortex-m7"]

[target.armv8r-none-eabihf]
rustflags = ["-C", "target-cpu=cortex-r52"]

[alias]
xtask-sil = "test -p helios-hil --release"
fw = "build --manifest-path crates/helios-vcu-fw/Cargo.toml --release --target thumbv7em-none-eabihf"
