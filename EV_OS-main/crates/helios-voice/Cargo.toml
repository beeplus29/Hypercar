[package]
name = "helios-voice"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "helios-voice"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1.80"
tokio-util = "0.7"
cpal = "0.15"
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eventsource-stream = "0.2"
futures-util = "0.3"
bytemuck = "1.14"
crossbeam-queue = "0.3"
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
whisper-rs = "0.11"
base64 = "0.21"
webrtc-vad = "0.4"
helios-dds = { path = "../helios-dds" }
