name: VCU Build & Aikido Security Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-scan:
    name: Aikido Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Aikido Security Scan
        uses: aikido-security/action@v1
        with:
          secret-key: ${{ secrets.AIKIDO_API_KEY }}
          fail-on-severity: high

  vcu-build-check:
    name: Core Workspace Build & Test
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Core Vehicle Crate Safety Invariants
        run: cargo test -p helios-core -p helios-can -p helios-vsm -p helios-vdc -p helios-zephyr-control-ffi
