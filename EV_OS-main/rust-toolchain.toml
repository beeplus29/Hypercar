[toolchain]
# Pinned for reproducible builds. Production safety builds switch to the
# Ferrocene qualified toolchain (see docs/ARCHITECTURE.md section 4.3).
channel = "1.99.0"
components = ["rustfmt", "clippy", "rust-src", "llvm-tools"]
targets = [
    "thumbv7em-none-eabihf",     # NXP S32K3 (Cortex-M7) VCU / zonal safety MCU
    "armv8r-none-eabihf",        # NXP S32G3 Cortex-R52 safety island
    "aarch64-unknown-linux-gnu", # S32G3 A53 / NVIDIA Thor Linux domains
    "aarch64-linux-android",     # AAOS vendor-side tooling
]
profile = "minimal"
