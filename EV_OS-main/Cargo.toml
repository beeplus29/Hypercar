[workspace]
resolver = "3"
members = [
    "crates/helios-core",
    "crates/helios-vsm",
    "crates/helios-vdc",
    "crates/helios-energy",
    "crates/helios-can",
    "crates/helios-twin",
    "crates/helios-ibeji-sil",
    "crates/helios-dds-sys",
    "crates/helios-dds",
    "crates/helios-vhal-server",
    "crates/helios-hil", "crates/helios-obd", "crates/helios-voice",
    "crates/helios-dev-console",
    "crates/helios-zephyr-control-ffi",
]
# The Zonal Controller firmware is a separate workspace member-less package: it only builds
# for thumbv7em-none-eabihf and needs its own linker script / profile.
exclude = ["crates/helios-zonal-fw"]
# `cargo test` at the root avoids crates requiring native DDS/audio dependencies.
default-members = [
    "crates/helios-core",
    "crates/helios-vsm",
    "crates/helios-vdc",
    "crates/helios-energy",
    "crates/helios-can",
    "crates/helios-twin",
    "crates/helios-ibeji-sil",
    "crates/helios-hil",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/beeplus29/HELIOS"
authors = ["HELIOS vehicle software team"]

[workspace.dependencies]
# Internal
helios-core = { path = "crates/helios-core", default-features = false }
helios-vsm = { path = "crates/helios-vsm", default-features = false }
helios-vdc = { path = "crates/helios-vdc", default-features = false }
helios-energy = { path = "crates/helios-energy", default-features = false }
helios-can = { path = "crates/helios-can", default-features = false }
helios-twin = { path = "crates/helios-twin" }
helios-ibeji-sil = { path = "crates/helios-ibeji-sil" }
helios-dds-sys = { path = "crates/helios-dds-sys" }
helios-dds = { path = "crates/helios-dds" }
rustecal = { version = "0.1.8", default-features = false, features = ["pubsub"] }
rustecal-types-serde = "0.1.5"
# no_std-safe
libm = "0.2.16"
heapless = "0.9.3"
# std / tooling
anyhow = "1.0.104"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
csv = "1.4.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-stream = { version = "0.1.19", features = ["net", "sync"] }
futures = "0.3.34"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
prost = "0.14.4"
socketcan = "4.0.0"
bindgen = "0.73.2"
cc = "1.5.1"
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "deny"
indexing_slicing = "allow"
unwrap_used = "warn"
panic = "warn"
cast_possible_truncation = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0
strip = "symbols"
overflow-checks = true   # keep arithmetic overflow checks in release for control code

# Faster optimized iteration for builds where thin-LTO link time dominates.
# Use `cargo build --profile release-fast` for a quick optimized executable.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

[profile.firmware]
inherits = "release"
opt-level = "s"
lto = false
codegen-units = 1
debug = 0
strip = false
panic = "abort"

[profile.dev]
opt-level = 1            # the twin runs 4 kHz RK4; unoptimised dev builds are too slow for tests
overflow-checks = true
